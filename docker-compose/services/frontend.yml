version: '3.9'

services:
  frontend:
    build:
      context: ../..
      dockerfile: ./Dockerfile
      target: frontend
    image: primea/blockscout-frontend:dev
    platform: linux/amd64
    restart: always
    container_name: 'frontend'
    env_file:
      - ./envs/common-frontend.env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 5
